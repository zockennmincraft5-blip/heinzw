<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>strukturierung2</title>
</head>
<body>
    <h1>fettgetrukter text</h1>
    fettgetrukter text<br>
    <b>fettgetrukter text (b)</b><br>
    <strong>fettgetrukter text (strong)</strong><br>
    <h1>kursivgetrukter text</h1>
    kursivgetrukter text<br>
    <i>kursivgetrukter text (i)</i><br>
    <em>kursivgetrukter text (em)</em><br>
    <h1>unterstrichener text</h1><br>
    unterstrichener text<br>    
    <u>unterstrichener text (u)</u><br>
    <h1>span-tag</h1><br>
    span-tag<br>
    <span>span-tag (span)</span><br>
</body>
</html>
