<!DOCTYPE html>
<html lang="de">

    <head>
        <meta charset="utf-8">
        <title>Farben</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>

        <div id="vordefeniert"> </div>
        <div id="hexdecimal"> 
            #RRGGBB <br>
            0 -> 09 <br>
            A -> 10 <br>
            B -> 11 <br>
            C -> 12 <br>
            D -> 13 <br>
            E -> 14 <br>
            F -> 15 <br>
            
            #FF0000 -> rot <br>
            #00FF00 -> grün <br>
            #0000FF -> Blau <br>
            16.777.216 -> Farben

        </div>
        <div id="rgb">
            rgb(255,255,255)
        </div>
        <div class="hintergrund">
            <div id="rgba">
                rgba(255,255,255,0.6)
            </div>
        </div>
        <div id="hsl">
            hsl(hue (farbton), Sättigung, Helligkeit) <br>
            hsl(300, 100%, 60%)
        </div>
        <div class="hintergrund">
            <div id="hsla">
                hsl(300, 100%, 60%, 0.6)
            </div>
        </div>
    </body>

</html>
