<!DOCTYPE html>
<html lang="de">

    <head>
        <meta charset="utf-8">
        <title>Formluar</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>
        get:<br><br>
        <form action="index.html" method="get"> 
            <input type="text" name="benutzername" placeholder="Benutzername"><br><br>
            <input type="radio" name="geschlecht" value="m"> Mänlich
            <input type="radio" name="geschlecht" value="w"> Weiblich<br><br>
            <input type="email" name="email" placeholder="Deine E-mail"><br><br>
            <input type="password" name="passwort" placeholder="dein Passwort"><br><br>
            <button type="submit">Abschicken</button>
        </form>
        <br><br><br><br>
        post<br><br>
        <form action="index.html" method="post"> 
            <input type="text" name="benutzername" placeholder="Benutzername"><br><br>
            <input type="radio" name="geschlecht" value="m"> Mänlich
            <input type="radio" name="geschlecht" value="w"> Weiblich<br><br>
            <input type="email" name="email" placeholder="Deine E-mail"><br><br>
            <input type="password" name="passwort" placeholder="dein Passwort"><br><br>
            <button type="submit">Abschicken</button>
        </form>
    </body>

</html>
