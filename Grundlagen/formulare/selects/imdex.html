<!DOCTYPE html>
<html lang="de">

    <head>
        <meta charset="utf-8">
        <title>select</title>
        <link rel="stylesheet" type="text/css" href="style.css">
    </head>

    <body>

        <select name="obst" size="3" multiple>
            
            <option value="apfel">Apfel</option>
            <option value="birne">Birne</option>
            <option value="orange">Orange</option>
            <option value="Mango">Mango</option>

        </select>

        <select name="handel" >

            <optgroup label="Obst">

            <option value="apfel">Apfel</option>
            <option value="birne">Birne</option>
            <option value="orange">Orange</option>
            <option value="Mango">Mango</option>

            </optgroup>
            <optgroup label="Gemüsse">

            <option value="kartophel">Kartophel</option>
            <option value="karote">Karote</option>
            <option value="brokoli">Brokoli</option>
            <option value="gurke">Gurke</option>

            </optgroup>
        </select>
    </body>

</html>
